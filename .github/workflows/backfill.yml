name: Backfill Fantrax
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * 10-12 *'
    - cron: '17 * * 1-3 *'
permissions:
  contents: write
concurrency: fantrax-ingestion
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check shooting calculations
        run: node --test tests/shooting.test.ts
      - name: Fetch and validate historical weeks
        env:
          FULL_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/refresh.ts
      - name: Commit complete backfill
        run: |
          git add data/2026-27/raw
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh validated Fantrax snapshots'
          git push
